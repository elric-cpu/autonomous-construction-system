[tool.poetry]
name = "construction-agentic-system"
version = "0.1.0"
description = "A multi-agent system for evaluating construction projects using CrewAI."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "construction_agentic_system", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
crewai = "^0.29.0"  # specify a recent version of the CrewAI framework
crewai-tools = "^0.29.0"  # tools for web search, etc.
python-dotenv = "^1.0.0"  # for loading .env variables

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"